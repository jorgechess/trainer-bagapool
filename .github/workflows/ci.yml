name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund 2>&1 | tee install.log
      - name: Testes unitários
        run: npm test 2>&1 | tee test.log
      - name: Verificação de tipos
        run: npx next telemetry disable >/dev/null 2>&1; npm run typecheck 2>&1 | tee typecheck.log
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-exemplo
        run: npm run build 2>&1 | tee build.log
      - name: Resumo dos erros
        if: failure()
        run: |
          for f in install test typecheck build; do
            if [ -f "$f.log" ]; then
              msg=$(tail -c 3500 "$f.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$f::$msg"
            fi
          done
