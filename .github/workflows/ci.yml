name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrações e permissões (RLS)
        run: scripts/test-db.sh 2>&1 | tee db.log
      - name: Resumo dos erros
        if: failure()
        run: |
          msg=$(tail -c 3500 db.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=banco::$msg"

  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund 2>&1 | tee install.log
      - name: Testes unitários
        run: npm test 2>&1 | tee test.log
      - name: Verificação de tipos
        run: npm run typecheck 2>&1 | tee typecheck.log
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-exemplo
        run: npm run build 2>&1 | tee build.log
      - name: Resumo dos erros
        if: failure()
        run: |
          for f in install test typecheck build; do
            if [ -f "$f.log" ]; then
              msg=$(tail -c 3500 "$f.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$f::$msg"
            fi
          done
